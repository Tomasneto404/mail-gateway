# Authored by Tomás Neto (TN 2026)
#
# mail-gateway, ready to run. In an empty folder with this file as compose.yaml:
#
#     cp .env.example .env               # optional: every setting has a default
#     docker compose up -d --wait
#     docker compose logs admin          # sign-in email + generated password
#
# Admin UI   http://localhost:3000/ui        API docs  http://localhost:3000/docs
# Mailpit    http://localhost:8025           (sandbox inbox: every sandbox key delivers here)
#
# Nothing to configure for a first run:
#   • secrets (database password, encryption key, first admin password) are generated on the first
#     start into ./secrets;
#   • data lives next to this file in ./data (postgres, redis, mailpit);
#   • every key starts in sandbox mode, so no real email leaves until you configure a relay in .env.
#
# Settings: .env (see .env.example). Values there fill the ${...} below and are passed to the
# gateway, so any setting of the application can be added there without editing this file.
#
# Updating: change MG_TAG (or pull latest), then `docker compose pull && docker compose up -d`.
# Migrations run automatically before the API and the worker start.
# Starting over: `docker compose down`, then delete ./data and ./secrets.

name: ${MG_PROJECT:-mailgw}

# Fixed wiring inside the stack. Not overridable from .env on purpose.
x-env: &env
  DATABASE_URL_FILE: /run/mg/database_url
  APP_ENCRYPTION_KEY_FILE: /run/mg/app_encryption_key
  REDIS_URL: redis://redis:6379
  MAILPIT_SMTP_HOST: mailpit
  MAILPIT_SMTP_PORT: "1025"
  # plain http on localhost by default; set COOKIE_SECURE=true in .env once behind HTTPS
  COOKIE_SECURE: ${COOKIE_SECURE:-false}

x-app: &app
  image: ${MG_IMAGE:-tomasneto26/mail_gateway}:${MG_TAG:-latest}
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=16m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  env_file:
    - path: .env
      required: false
  environment: *env
  volumes:
    - ./secrets:/run/mg:ro,z
  networks: [internal]

services:
  # One-shot: generates the secrets into ./secrets on the first start, keeps them afterwards.
  setup:
    image: ${MG_IMAGE:-tomasneto26/mail_gateway}:${MG_TAG:-latest}
    user: "0"
    read_only: true
    # root inside the container, limited to managing the files of ./secrets
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    volumes:
      - ./secrets:/run/mg:z
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cd /run/mg
        # the folder belongs to the first regular user on the host (uid 1000), so it can be read and cleaned without sudo
        chown 1000:1000 . && chmod 755 .
        umask 077
        rnd() { node -e "process.stdout.write(require('crypto').randomBytes($$1).toString('$$2'))"; }
        [ -s postgres_password ]  || { rnd 24 hex > postgres_password; echo "generated database password"; }
        [ -s app_encryption_key ] || { rnd 32 base64 > app_encryption_key; echo "generated encryption key"; }
        [ -s admin_password ]     || { rnd 15 base64url > admin_password; echo "generated admin password"; }
        printf 'postgresql://mailgw:%s@postgres:5432/mailgw' "$$(cat postgres_password)" > database_url
        # postgres (uid 70) reads its password; the app (uid 1000) reads the rest
        chown 70:70 postgres_password
        chown 1000:1000 app_encryption_key admin_password database_url
        chmod 400 postgres_password app_encryption_key admin_password database_url

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailgw
      POSTGRES_DB: mailgw
      POSTGRES_PASSWORD_FILE: /run/mg/postgres_password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:z
      - ./secrets:/run/mg:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailgw -d mailgw"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      setup:
        condition: service_completed_successfully
    networks: [internal]

  # Scheduled pg_dump into ./backups (custom format), pruned after MG_BACKUP_KEEP_DAYS.
  # Keep ./secrets with the backups: message bodies are encrypted with the key stored there.
  # Restore: docker compose exec -T backup sh -c 'PGPASSWORD=$(cat /run/mg/postgres_password) pg_restore --clean --if-exists -d mailgw' < backups/<file>.dump
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: mailgw
      PGDATABASE: mailgw
      INTERVAL_HOURS: ${MG_BACKUP_INTERVAL_HOURS:-24}
      KEEP_DAYS: ${MG_BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups:z
      - ./secrets:/run/mg:ro,z
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$$INTERVAL_HOURS" = "0" ]; then echo "backups disabled (MG_BACKUP_INTERVAL_HOURS=0)"; exec sleep infinity; fi
        export PGPASSWORD="$$(cat /run/mg/postgres_password)"
        while true; do
          f="/backups/mailgw-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          if pg_dump -Fc -f "$$f.tmp"; then mv "$$f.tmp" "$$f"; chown 1000:1000 "$$f"; echo "backup written: $$f ($$(du -h "$$f" | cut -f1))"
          else rm -f "$$f.tmp"; echo "backup FAILED" >&2; fi
          find /backups -name 'mailgw-*.dump' -mtime +"$$KEEP_DAYS" -delete
          sleep $$((INTERVAL_HOURS * 3600))
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ needs noeviction; AOF keeps quotas, dedup and the queue across restarts
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - ./data/redis:/data:z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - ./data/mailpit:/data:z
    ports:
      - "${MG_BIND:-127.0.0.1}:${MG_MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  # One-shot: applies database migrations (Prisma reads DATABASE_URL, so it is loaded from the file here).
  migrate:
    image: ${MG_IMAGE:-tomasneto26/mail_gateway}:${MG_TAG:-latest}-migrate
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./secrets:/run/mg:ro,z
    entrypoint: ["/bin/sh", "-ec"]
    command: ['DATABASE_URL="$$(cat /run/mg/database_url)" exec node node_modules/prisma/build/index.js migrate deploy']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # One-shot: creates the first administrator when there is none, and prints how to sign in.
  admin:
    <<: *app
    restart: "no"
    environment:
      <<: *env
      MG_ADMIN_EMAIL: ${MG_ADMIN_EMAIL:-admin@example.com}
      MG_URL: ${PUBLIC_URL:-http://localhost:${MG_HTTP_PORT:-3000}}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if node dist/cli.js users:list 2>/dev/null | grep -q '@'; then
          echo "An administrator already exists; nothing to do."
          exit 0
        fi
        node dist/cli.js users:create --email "$$MG_ADMIN_EMAIL" --name Administrator --role Admin --password-stdin < /run/mg/admin_password > /dev/null
        echo
        echo "  mail-gateway is ready: $$MG_URL/ui"
        echo "  Sign in as $$MG_ADMIN_EMAIL with password: $$(cat /run/mg/admin_password)"
        echo "  (also in ./secrets/admin_password)"
        echo
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    command: ["node", "dist/main.api.js"]
    ports:
      - "${MG_BIND:-127.0.0.1}:${MG_HTTP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      admin:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["node", "dist/main.worker.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9464/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

networks:
  internal:
    ipam:
      config:
        # A fixed subnet that rarely collides with VPN/LAN routes; change it if `ip route` shows an overlap.
        - subnet: ${MG_SUBNET:-10.213.9.0/24}
