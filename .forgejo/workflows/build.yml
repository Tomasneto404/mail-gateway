# Authored by Tomás Neto (TN 2026)
# Build & Push (Forgejo) — builds the Docker images and pushes them to the registry in DOCKERHUB_URL.
#   • runtime image (api + worker):  <registry>/<repository>:<tag>
#   • migrations image:              <registry>/<repository>:<tag>-migrate
# Both images are verified as the non-root user before anything is pushed
# (scripts/check-runtime-image.mjs).
# Triggers: pushing a tag v1.2.3 (→ 1.2.3, 1.2, latest, prod, sha-<commit>), or manual run with an
# optional version (empty → dev, sha-<commit>). Every release (not pre-releases such as 1.3.0-rc.1,
# not dev builds) is also tagged :prod (and prod-migrate). Tag logic: scripts/ci-image-tags.sh.
#
# Runner: the job image has no Docker; it runs in node:22-alpine, installs the docker CLI + buildx
# with apk and builds through the runner's host Docker daemon (act_runner
# `container.docker_host: automount`). Plain `docker build/push` — no docker/* actions, so no
# separate BuildKit builder; layer cache stays in the host daemon between runs. linux/amd64 only.
#
# Repository VARIABLES: DOCKERHUB_URL, DOCKERHUB_REPOSITORY, DOCKERHUB_USERNAME
# Repository SECRET:    DOCKERHUB_TOKEN (password or access token with push rights)
name: Build & Push

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, bare semver e.g. 1.2.0 (→ :1.2.0, :1.2, :latest, :prod). Empty → :dev"
        required: false
        default: ""
  push:
    tags: ["v*.*.*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # bash is not in the image yet, so this step uses sh.
      - name: Install tools (git, bash, docker CLI + buildx)
        shell: sh
        run: apk add --no-cache git bash docker-cli docker-cli-buildx

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check Docker daemon access
        run: |
          docker version --format 'client {{.Client.Version}} / server {{.Server.Version}}' || {
            echo "::error::No Docker daemon in the job container. The act_runner needs container.docker_host: automount (or a mounted /var/run/docker.sock)."
            exit 1
          }

      - name: Resolve image and tags
        id: meta
        env:
          REGISTRY: ${{ vars.DOCKERHUB_URL }}
          REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAGS: prod
        run: |
          bash scripts/ci-image-tags.sh >> "$GITHUB_OUTPUT"
          bash scripts/ci-image-tags.sh | sed -n '/runtime_tags/,/__TAGS__/p'

      - name: Log in to the registry
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          REGISTRY_USER: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${REGISTRY_USER:?Set the DOCKERHUB_USERNAME variable}"
          : "${REGISTRY_TOKEN:?Set the DOCKERHUB_TOKEN secret}"
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin

      - name: Build images
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          label_args=()
          while IFS= read -r l; do [ -n "$l" ] && label_args+=(--label "$l"); done <<< "$LABELS"
          docker build --pull --target runtime --tag mail-gateway-verify:runtime "${label_args[@]}" .
          docker build --target migrate --tag mail-gateway-verify:migrate "${label_args[@]}" .

      # The script is streamed over stdin: with the host Docker socket, bind mounts would resolve
      # on the host, not in the job container.
      - name: Verify runtime image as non-root
        run: docker run --rm -i --entrypoint node mail-gateway-verify:runtime --input-type=module - < scripts/check-runtime-image.mjs

      - name: Verify migrations image as non-root
        run: docker run --rm --entrypoint node mail-gateway-verify:migrate node_modules/prisma/build/index.js validate

      - name: Push images
        env:
          RUNTIME_TAGS: ${{ steps.meta.outputs.runtime_tags }}
          MIGRATE_TAGS: ${{ steps.meta.outputs.migrate_tags }}
        run: |
          set -euo pipefail
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker tag mail-gateway-verify:runtime "$t" && docker push "$t"
          done <<< "$RUNTIME_TAGS"
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker tag mail-gateway-verify:migrate "$t" && docker push "$t"
          done <<< "$MIGRATE_TAGS"

      - name: Clean up
        if: always()
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          RUNTIME_TAGS: ${{ steps.meta.outputs.runtime_tags }}
          MIGRATE_TAGS: ${{ steps.meta.outputs.migrate_tags }}
        run: |
          docker logout "$REGISTRY" >/dev/null 2>&1 || true
          # remove our tags from the shared host daemon (layers stay cached)
          for t in mail-gateway-verify:runtime mail-gateway-verify:migrate $RUNTIME_TAGS $MIGRATE_TAGS; do
            docker image rm "$t" >/dev/null 2>&1 || true
          done

      - name: Summary
        run: |
          echo "Pushed ${{ steps.meta.outputs.image }} version ${{ steps.meta.outputs.version }}"
          echo "Deploy with (.env): MAIL_GATEWAY_REGISTRY=${{ steps.meta.outputs.registry }} MAIL_GATEWAY_IMAGE=${{ steps.meta.outputs.repository }} MAIL_GATEWAY_TAG=${{ steps.meta.outputs.version }}"
