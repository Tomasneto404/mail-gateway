# Local development only (auto-loaded by `docker compose up`).
# Exposes the Mailpit UI; never use this file in production.
services:
  mailpit:
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
  api:
    environment:
      # plain-http local development only
      COOKIE_SECURE: "false"
